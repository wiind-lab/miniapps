<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사각형 스피드 퀴즈</title>
  <style>
    :root{
      --bg:#eef4ff; --card:#ffffff; --text:#172033; --muted:#667085;
      --primary:#356ae6; --primary-dark:#2452bd; --border:#d8e2f2;
      --good:#16845b; --bad:#d04444; --soft:#f5f8ff;
      --shadow:0 14px 36px rgba(35,68,125,.12); --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button{font:inherit}
    .miniapp{min-height:100vh;display:flex;flex-direction:column;padding:18px;gap:14px}
    .app-header,.app-main,.app-controls,.app-footer{width:100%;max-width:1180px;margin:0 auto}
    .app-header{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .title-group h1{margin:0;font-size:clamp(1.8rem,4vw,3.2rem);letter-spacing:-.04em}
    .title-group p{margin:4px 0 0;color:var(--muted);font-size:clamp(.95rem,1.8vw,1.15rem)}
    .app-tag{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--muted);font-weight:800;white-space:nowrap}
    .app-main{flex:1;display:flex;align-items:stretch}
    .activity-card{width:100%;min-height:560px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,3vw,34px);display:flex;flex-direction:column}
    .start-screen,.result-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
    .start-icon{font-size:clamp(4rem,10vw,7rem);line-height:1}
    .start-screen h2,.result-screen h2{margin:0;font-size:clamp(2rem,5vw,3.8rem);letter-spacing:-.04em}
    .start-screen p{margin:0;max-width:720px;color:var(--muted);font-size:clamp(1rem,2.2vw,1.35rem);line-height:1.65}
    .rule-box{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(760px,100%)}
    .rule{padding:14px 12px;border-radius:16px;background:var(--soft);font-weight:800;color:#40506a}
    .game-screen{flex:1;display:flex;flex-direction:column;gap:12px}
    .game-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
    .progress{font-weight:900;font-size:clamp(1rem,2vw,1.25rem)}
    .question{font-size:clamp(1.35rem,3vw,2rem);font-weight:950;text-align:center;letter-spacing:-.03em}
    .timer{text-align:right;font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(1rem,2vw,1.25rem)}
    .shape-stage{position:relative;flex:1;min-height:270px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:linear-gradient(180deg,#fbfdff,#f4f8ff);border:1px solid #e2e9f5;overflow:hidden}
    #shapeSvg{width:min(74vw,600px);height:min(36vh,320px);max-width:100%}
    .feedback{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(4rem,12vw,8rem);font-weight:1000;opacity:0;transform:scale(.65)}
    .feedback.show-good{animation:goodPop .34s ease-out}
    .feedback.show-bad{animation:badPop .38s ease-out}
    @keyframes goodPop{0%{opacity:0;transform:scale(.65)}35%{opacity:.95;transform:scale(1.08)}100%{opacity:0;transform:scale(1.2)}}
    @keyframes badPop{0%{opacity:0;transform:translateX(0) scale(.8)}25%{opacity:.95;transform:translateX(-12px) scale(1)}50%{transform:translateX(12px) scale(1)}75%{transform:translateX(-7px) scale(1)}100%{opacity:0;transform:translateX(0) scale(1.05)}}
    .penalty-badge{position:absolute;top:16px;right:18px;background:#fff0f0;color:var(--bad);border:1px solid #ffcaca;border-radius:999px;padding:8px 12px;font-weight:900;opacity:0;transform:translateY(-6px)}
    .penalty-badge.show{animation:penalty .7s ease}
    @keyframes penalty{0%{opacity:0;transform:translateY(-8px)}20%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
    .answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    button{border:0;border-radius:17px;padding:15px 18px;font-weight:900;cursor:pointer;transition:transform .1s ease,filter .1s ease,opacity .1s ease}
    button:active{transform:scale(.97)}
    button:disabled{opacity:.5;cursor:not-allowed}
    .answer-btn{min-height:82px;font-size:clamp(1rem,1.8vw,1.22rem);border:2px solid transparent}
    .answer-btn:hover{filter:brightness(.96)}
    .answer-btn[data-answer="trapezoid"]{background:#fff0b8;color:#6e5700;border-color:#ead16d}
    .answer-btn[data-answer="parallelogram"]{background:#d9eee4;color:#245b47;border-color:#9ccfba}
    .answer-btn[data-answer="rectangle"]{background:#dce9ff;color:#28538c;border-color:#a9c5ee}
    .answer-btn[data-answer="rhombus"]{background:#eadff5;color:#654483;border-color:#c8addf}
    .answer-btn[data-answer="square"]{background:#f8ddd6;color:#8a4938;border-color:#e8ad9e}
    .answer-btn.wrong{background:#fff0f0;border-color:#ef9c9c;color:#a92f2f;animation:wrongBtn .3s ease}
    @keyframes wrongBtn{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
    .primary-btn{background:var(--primary);color:#fff;font-size:1.2rem;padding:17px 30px;box-shadow:0 7px 18px rgba(53,106,230,.24)}
    .primary-btn:hover{background:var(--primary-dark)}
    .nickname-box{width:min(520px,100%);display:flex;flex-direction:column;gap:8px;text-align:left}
    .nickname-box label{font-weight:900;color:#40506a}
    .nickname-input{width:100%;padding:16px 18px;border:2px solid var(--border);border-radius:16px;background:#fff;color:var(--text);font:inherit;font-size:1.15rem;font-weight:800;outline:none}
    .nickname-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(53,106,230,.10)}
    .nickname-help{text-align:center;font-size:.9rem;color:var(--muted);min-height:1.2em}
    .result-owner{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:950;color:#40506a}
    .result-time{font-size:clamp(3.6rem,11vw,7.5rem);font-weight:1000;letter-spacing:-.06em;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1}
    .result-label{font-weight:900;color:var(--muted)}
    .result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(820px,100%)}
    .stat{background:var(--soft);border:1px solid var(--border);border-radius:18px;padding:16px}
    .stat strong{display:block;font-size:clamp(1.45rem,3vw,2.15rem);font-variant-numeric:tabular-nums}
    .stat span{color:var(--muted);font-weight:800;font-size:.92rem}
    .stat.penalty strong{color:var(--bad)}
    .result-detail{color:var(--muted);font-weight:800}
    .result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .secondary-btn{background:#edf3ff;color:#244c9c;border:2px solid #cbdafb;font-size:1.08rem;padding:15px 24px}
    .app-controls{display:flex;justify-content:center}
    .app-footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.92rem}
    .hidden{display:none!important}
    @media(max-width:760px){
      .miniapp{padding:10px;gap:9px}
      .app-header{align-items:flex-start}
      .title-group p,.app-tag{display:none}
      .activity-card{min-height:calc(100vh - 92px);padding:13px}
      .game-top{grid-template-columns:1fr 1fr}
      .question{grid-column:1/-1;grid-row:1;text-align:center}
      .progress{grid-row:2}
      .timer{grid-row:2}
      .shape-stage{min-height:250px}
      #shapeSvg{height:min(37vh,330px);width:92vw}
      .answer-grid{grid-template-columns:repeat(2,1fr)}
      .answer-btn:last-child{grid-column:1/-1}
      .answer-btn{min-height:54px;padding:11px 8px}
      .rule-box,.result-stats{grid-template-columns:1fr}
      .app-footer{display:none}
    }
  
.quit-btn{border:1px solid #d6deeb;border-radius:12px;background:#fff;color:#667085;
padding:8px 13px;font-weight:850;cursor:pointer;white-space:nowrap}
.quit-btn:hover{background:#f4f6fa}

</style>
</head>
<body>
<div class="miniapp">
  <header class="app-header">
    <div class="title-group">
      <h1 id="appTitle">사각형 스피드 퀴즈</h1>
      <p id="appSubtitle">20문제 기록 도전</p>
    </div>
    <div class="app-tag" id="appTag">수학 · 도형 분류</div>
  </header>

  <main class="app-main">
    <section class="activity-card">
      <div class="start-screen" id="startScreen">
        <div class="start-icon">◇</div>
        <h2>가장 알맞은 이름은?</h2>
        <p>사각형의 모양을 보고 가장 구체적인 이름을 골라 보세요. 정답을 맞혀야 다음 문제로 넘어갑니다.</p>
        <div class="rule-box">
          <div class="rule">20문제 · 각 도형 4개</div>
          <div class="rule">오답 1회 = +5초</div>
        </div>
        <div class="nickname-box">
          <label for="nicknameInput">도전자 닉네임을 입력하세요</label>
          <input id="nicknameInput" class="nickname-input" maxlength="12" autocomplete="off" placeholder="닉네임을 입력하세요" />
          <div class="nickname-help" id="nicknameHelp">닉네임을 입력하면 게임을 시작할 수 있어요.</div>
        </div>
        <button class="primary-btn" id="startButton" disabled>게임 시작</button>
      </div>

      <div class="game-screen hidden" id="gameScreen">
        <div class="game-top">
<button class="quit-btn" id="quitButton" type="button">그만하기</button>
          <div class="progress" id="progressText">1 / 20</div>
          <div class="question">가장 알맞은 이름은?</div>
          <div class="timer" id="timerText">0.0초</div>
        </div>
        <div class="shape-stage">
          <svg id="shapeSvg" viewBox="0 0 640 400" role="img" aria-label="문제 사각형"></svg>
          <div class="feedback" id="feedback"></div>
          <div class="penalty-badge" id="penaltyBadge">+5초</div>
        </div>
        <div class="answer-grid" id="answerGrid">
          <button class="answer-btn" data-answer="trapezoid">사다리꼴</button>
          <button class="answer-btn" data-answer="parallelogram">평행사변형</button>
          <button class="answer-btn" data-answer="rectangle">직사각형</button>
          <button class="answer-btn" data-answer="rhombus">마름모</button>
          <button class="answer-btn" data-answer="square">정사각형</button>
        </div>
      </div>

      <div class="result-screen hidden" id="resultScreen">
        <div class="result-owner" id="resultOwner">도전자의 기록</div>
        <h2 id="resultTitle">완주!</h2>
        <div class="result-stats">
          <div class="stat"><strong id="finalTime">0.0초</strong><span>내 기록</span></div>
          <div class="stat penalty"><strong id="penaltyTime">+0초</strong><span>페널티</span></div>
          <div class="stat"><strong id="accuracy">100%</strong><span>정답률(첫 시도)</span></div>
        </div>
        <div class="result-detail" id="resultDetail">실제 0.0초 · 오답 0회</div>
        <div class="result-actions">
          <button class="primary-btn" id="retryButton">다시 도전</button>
          <button class="secondary-btn" id="captureButton">기록 이미지 저장</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div id="statusMessage">준비됨</div>
    <div>사다리꼴 · 평행사변형 · 직사각형 · 마름모 · 정사각형</div>
  </footer>
</div>

<script>
const MINI_APP_INFO = {
  id: "quadrilateral-speed-quiz",
  number: "05",
  title: "사각형 스피드 퀴즈",
  subtitle: "20문제 기록 도전",
  subject: "수학",
  grade: ["4"],
  topic: "여러 가지 사각형",
  activityType: "스피드 퀴즈",
  lessonPhase: ["전개", "정리"],
  description: "사각형의 가장 알맞은 이름을 빠르게 구분하는 20문제 기록 게임입니다.",
  version: "1.1.0",
  storageKey: "miniapps.quadrilateralSpeedQuiz.v1"
};

const TYPES = ["trapezoid","parallelogram","rectangle","rhombus","square"];
const LABELS = {
  trapezoid:"사다리꼴", parallelogram:"평행사변형",
  rectangle:"직사각형", rhombus:"마름모", square:"정사각형"
};
const TOTAL = 20;
const PENALTY_SECONDS = 5;

let state = {
  mode:"ready",
  questions:[],
  index:0,
  wrong:0,
  firstTryCorrect:0,
  wrongOnCurrent:0,
  startedAt:0,
  endedAt:0,
  locked:false,
  nickname:""
};
let timerRaf = null;

const $ = id => document.getElementById(id);
const rand = (min,max) => min + Math.random()*(max-min);
const randInt = (min,max) => Math.floor(rand(min,max+1));
const choice = arr => arr[Math.floor(Math.random()*arr.length)];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function initApp(){
  document.title = `${MINI_APP_INFO.number}. ${MINI_APP_INFO.title}`;
  $("appTitle").textContent = MINI_APP_INFO.title;
  $("appSubtitle").textContent = MINI_APP_INFO.subtitle;
  $("appTag").textContent = `${MINI_APP_INFO.subject} · ${MINI_APP_INFO.activityType}`;
  bindEvents();
  showReady();
}

function bindEvents(){
  $("startButton").addEventListener("click", startGame);
  $("retryButton").addEventListener("click", startGame);
  $("captureButton").addEventListener("click", saveResultImage);
  $("nicknameInput").addEventListener("input", validateNickname);
  $("nicknameInput").addEventListener("keydown", e=>{
    if(e.key==="Enter" && !$("startButton").disabled) startGame();
  });
  document.querySelectorAll(".answer-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>answer(btn.dataset.answer, btn));
  });
}

function validateNickname(){
  const nickname=$("nicknameInput").value.trim();
  $("startButton").disabled=!nickname;
  $("nicknameHelp").textContent=nickname ? `${nickname} 님, 준비되면 시작하세요!` : "닉네임을 입력하면 게임을 시작할 수 있어요.";
}

function buildQuestionSet(){
  const q=[];
  TYPES.forEach(type=>{
    for(let i=0;i<4;i++) q.push({type, variant:i});
  });
  return shuffle(q);
}

function showReady(){
  state.mode="ready";
  $("startScreen").classList.remove("hidden");
  $("gameScreen").classList.add("hidden");
  $("resultScreen").classList.add("hidden");
  $("statusMessage").textContent="준비됨";
}

function startGame(){
  const entered=$("nicknameInput").value.trim();
  const nickname=entered || state.nickname;
  if(!nickname){
    $("nicknameHelp").textContent="닉네임을 먼저 입력해 주세요.";
    $("nicknameInput").focus();
    return;
  }
  if(timerRaf) cancelAnimationFrame(timerRaf);
  state={
    mode:"playing", questions:buildQuestionSet(), index:0, wrong:0,
    firstTryCorrect:0, wrongOnCurrent:0, startedAt:performance.now(),
    endedAt:0, locked:false, nickname
  };
  $("startScreen").classList.add("hidden");
  $("resultScreen").classList.add("hidden");
  $("gameScreen").classList.remove("hidden");
  $("statusMessage").textContent="도전 중";
  renderQuestion();
  tickTimer();
}

function tickTimer(){
  if(state.mode!=="playing") return;
  const elapsed=(performance.now()-state.startedAt)/1000;
  $("timerText").textContent=`${elapsed.toFixed(1)}초`;
  timerRaf=requestAnimationFrame(tickTimer);
}

function renderQuestion(){
  state.wrongOnCurrent=0;
  state.locked=false;
  $("progressText").textContent=`${state.index+1} / ${TOTAL}`;
  document.querySelectorAll(".answer-btn").forEach(b=>{
    b.disabled=false; b.classList.remove("wrong");
  });
  drawShape(state.questions[state.index].type);
}

function answer(type, button){
  if(state.mode!=="playing" || state.locked) return;
  const correct=state.questions[state.index].type;
  if(type!==correct){
    state.wrong++;
    state.wrongOnCurrent++;
    button.classList.remove("wrong");
    void button.offsetWidth;
    button.classList.add("wrong");
    showFeedback(false);
    return;
  }

  if(state.wrongOnCurrent===0) state.firstTryCorrect++;
  state.locked=true;
  document.querySelectorAll(".answer-btn").forEach(b=>b.disabled=true);
  showFeedback(true);

  setTimeout(()=>{
    state.index++;
    if(state.index>=TOTAL) finishGame();
    else renderQuestion();
  }, 300);
}

function showFeedback(good){
  const f=$("feedback");
  f.textContent=good ? "✓" : "✕";
  f.style.color=good ? "var(--good)" : "var(--bad)";
  f.className="feedback";
  void f.offsetWidth;
  f.classList.add(good ? "show-good" : "show-bad");
  if(!good){
    const p=$("penaltyBadge");
    p.classList.remove("show");
    void p.offsetWidth;
    p.classList.add("show");
  }
}

function finishGame(){
  state.mode="result";
  state.endedAt=performance.now();
  if(timerRaf) cancelAnimationFrame(timerRaf);
  const raw=(state.endedAt-state.startedAt)/1000;
  const penalty=state.wrong*PENALTY_SECONDS;
  const final=raw+penalty;
  const acc=Math.round((state.firstTryCorrect/TOTAL)*100);

  $("gameScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
  $("resultOwner").textContent=`${state.nickname}의 기록`;
  $("finalTime").textContent=`${final.toFixed(1)}초`;
  $("penaltyTime").textContent=`+${penalty}초`;
  $("accuracy").textContent=`${acc}%`;
  $("resultDetail").textContent=`실제 ${raw.toFixed(1)}초 · 오답 ${state.wrong}회`;
  $("resultTitle").textContent=state.wrong===0 ? "완벽한 완주!" : "완주!";
  $("statusMessage").textContent=`${state.nickname} · 기록 ${final.toFixed(1)}초`;
  state.result={raw,penalty,final,acc};
}

function saveResultImage(){
  if(!state.result) return;
  const canvas=document.createElement("canvas");
  canvas.width=1200; canvas.height=675;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#eef4ff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ffffff";
  roundRect(ctx,90,65,1020,545,36); ctx.fill();

  ctx.textAlign="center";
  ctx.fillStyle="#172033";
  ctx.font="900 44px system-ui, sans-serif";
  ctx.fillText("사각형 스피드 퀴즈",600,135);
  ctx.fillStyle="#40506a";
  ctx.font="900 38px system-ui, sans-serif";
  ctx.fillText(`${state.nickname}의 기록`,600,205);

  const cards=[
    {x:155,label:"내 기록",value:`${state.result.final.toFixed(1)}초`,color:"#356ae6"},
    {x:455,label:"페널티",value:`+${state.result.penalty}초`,color:"#d04444"},
    {x:755,label:"정답률(첫 시도)",value:`${state.result.acc}%`,color:"#16845b"}
  ];
  cards.forEach(c=>{
    ctx.fillStyle="#f5f8ff"; roundRect(ctx,c.x,260,290,180,24); ctx.fill();
    ctx.fillStyle=c.color; ctx.font="1000 48px system-ui, sans-serif";
    ctx.fillText(c.value,c.x+145,335);
    ctx.fillStyle="#667085"; ctx.font="800 25px system-ui, sans-serif";
    ctx.fillText(c.label,c.x+145,392);
  });

  ctx.fillStyle="#667085"; ctx.font="800 26px system-ui, sans-serif";
  ctx.fillText(`실제 ${state.result.raw.toFixed(1)}초 · 오답 ${state.wrong}회 · 20문제`,600,510);
  ctx.font="700 21px system-ui, sans-serif";
  ctx.fillText("가장 알맞은 이름은?",600,565);

  const link=document.createElement("a");
  const safe=state.nickname.replace(/[\\/:*?"<>|]/g,"_");
  link.download=`사각형스피드퀴즈_${safe}_${state.result.final.toFixed(1)}초.png`;
  link.href=canvas.toDataURL("image/png");
  document.body.appendChild(link); link.click(); link.remove();
}

function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawShape(type){
  const svg=$("shapeSvg");
  const pts=generateCanonical(type);
  const transformed=transformPoints(pts);
  const points=transformed.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  svg.innerHTML=`
    <polygon points="${points}"
      fill="#dce8ff" stroke="#172033" stroke-width="7"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  `;
}

function generateCanonical(type){
  if(type==="square"){
    const s=rand(145,215);
    return centeredRect(s,s);
  }

  if(type==="rectangle"){
    let w=rand(235,330), h=rand(105,185);
    if(w/h<1.45) w=h*rand(1.5,2.15);
    if(Math.random()<.35) [w,h]=[h,w];
    return centeredRect(w,h);
  }

  if(type==="parallelogram"){
    const w=rand(220,310), h=rand(115,205);
    let shift=rand(55,125)*(Math.random()<.5?-1:1);
    return [
      {x:-w/2+shift/2,y:-h/2},
      {x: w/2+shift/2,y:-h/2},
      {x: w/2-shift/2,y: h/2},
      {x:-w/2-shift/2,y: h/2}
    ];
  }

  if(type==="rhombus"){
    const side=rand(155,215);
    let angle=rand(48,76)*Math.PI/180;
    if(Math.random()<.5) angle=Math.PI-angle;
    const u={x:side,y:0};
    const v={x:side*Math.cos(angle),y:side*Math.sin(angle)};
    return centerPoints([
      {x:0,y:0},{x:u.x,y:u.y},{x:u.x+v.x,y:u.y+v.y},{x:v.x,y:v.y}
    ]);
  }

  // 사다리꼴: 정확히 한 쌍의 대변만 평행한 형태.
  const bottom=rand(235,330);
  let top=rand(105,210);
  if(Math.abs(bottom-top)<45) top=Math.max(90,bottom-rand(55,110));
  const h=rand(120,205);
  let offset=rand(-75,75);
  // 옆변까지 평행해져 평행사변형이 되는 경우를 구조적으로 피한다.
  if(Math.abs(offset-(bottom-top)/2)<18) offset+=35;
  return centerPoints([
    {x:-bottom/2,y:h/2},
    {x: bottom/2,y:h/2},
    {x: top/2+offset,y:-h/2},
    {x:-top/2+offset,y:-h/2}
  ]);
}

function centeredRect(w,h){
  return [
    {x:-w/2,y:-h/2},{x:w/2,y:-h/2},
    {x:w/2,y:h/2},{x:-w/2,y:h/2}
  ];
}

function centerPoints(points){
  const cx=points.reduce((s,p)=>s+p.x,0)/points.length;
  const cy=points.reduce((s,p)=>s+p.y,0)/points.length;
  return points.map(p=>({x:p.x-cx,y:p.y-cy}));
}

function transformPoints(points){
  const angle=rand(-70,70)*Math.PI/180;
  const c=Math.cos(angle), s=Math.sin(angle);
  let rotated=points.map(p=>({x:p.x*c-p.y*s,y:p.x*s+p.y*c}));
  let minX=Math.min(...rotated.map(p=>p.x)), maxX=Math.max(...rotated.map(p=>p.x));
  let minY=Math.min(...rotated.map(p=>p.y)), maxY=Math.max(...rotated.map(p=>p.y));
  const bw=maxX-minX, bh=maxY-minY;
  const scale=Math.min(470/bw,285/bh,1.28);
  rotated=rotated.map(p=>({x:p.x*scale,y:p.y*scale}));
  minX=Math.min(...rotated.map(p=>p.x)); maxX=Math.max(...rotated.map(p=>p.x));
  minY=Math.min(...rotated.map(p=>p.y)); maxY=Math.max(...rotated.map(p=>p.y));
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const jitterX=rand(-24,24), jitterY=rand(-12,12);
  return rotated.map(p=>({x:p.x-cx+320+jitterX,y:p.y-cy+200+jitterY}));
}

initApp();

const __quadQuitButton = document.getElementById("quitButton");
if (__quadQuitButton) {
  __quadQuitButton.addEventListener("click", () => {
    if (!confirm("게임을 그만하고 시작 화면으로 돌아갈까요?")) return;
    if (typeof timerRaf !== "undefined" && timerRaf) cancelAnimationFrame(timerRaf);
    if (typeof state !== "undefined") {
      state.mode = "ready";
      if ("locked" in state) state.locked = false;
    }
    const game = document.getElementById("gameScreen");
    const result = document.getElementById("resultScreen");
    const start = document.getElementById("startScreen");
    if (game) game.classList.add("hidden");
    if (result) result.classList.add("hidden");
    if (start) start.classList.remove("hidden");
    const status = document.getElementById("statusMessage");
    if (status) status.textContent = "준비됨";
  });
}
